<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSphere - Belajar Bahasa & Aksara Interaktif</title>

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --font-main: 'Outfit', sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --glass-surface: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(255, 255, 255, 0.8);
      --theme-pink: #ec4899;
      --theme-pink-hover: #db2777;
      --theme-soft-pink: #fdf2f8;
      --theme-green: #10b981;
      --theme-soft-green: #ecfdf5;
      --theme-gray: #94a3b8;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-card: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      color: var(--text-dark);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      transition: background 0.4s ease-in-out;
    }

    /* TEMA BACKGROUND */
    body.theme-jp {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(236, 72, 153, 0.35)),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1600&auto=format&fit=crop');
    }

    body.theme-jv {
      background-image: linear-gradient(135deg, rgba(30, 27, 24, 0.6), rgba(180, 83, 9, 0.38)),
        url('https://images.unsplash.com/photo-1596402184320-417e7178b2cd?q=80&w=1600&auto=format&fit=crop');
    }

    body.theme-en {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.65), rgba(2, 132, 199, 0.38)),
        url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=1600&auto=format&fit=crop');
    }

    /* HEADER NAVIGATION */
    header {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .brand-logo i {
      color: var(--theme-pink);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 0.5rem 1.1rem;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--theme-pink);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
      border-color: var(--theme-pink);
    }

    main {
      max-width: 1050px;
      margin: 2.2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .glass-box {
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2.2rem;
      box-shadow: 0 16px 36px 0 rgba(15, 23, 42, 0.14);
      margin-bottom: 2rem;
    }

    /* GRID SUBLEVEL PERSIS GAMBAR */
    .sublevel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.3rem;
      margin-top: 1.8rem;
    }

    .sublevel-card {
      background: #ffffff;
      border: 1.5px solid var(--border-card);
      border-radius: 18px;
      padding: 1.35rem 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 185px;
      position: relative;
      transition: all 0.25s ease;
    }

    .sublevel-card:not(.locked):hover {
      transform: translateY(-4px);
      border-color: var(--theme-pink);
      box-shadow: 0 12px 24px rgba(236, 72, 153, 0.12);
    }

    .sublevel-card.locked {
      background: #f8fafc;
      border-color: #e2e8f0;
      opacity: 0.85;
    }

    .sublevel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .sublevel-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--theme-pink);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .sublevel-badge-done {
      background: var(--theme-soft-green);
      color: var(--theme-green);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .sublevel-badge-lock {
      background: #f1f5f9;
      color: var(--theme-gray);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .sublevel-card h4 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.3rem;
      line-height: 1.35;
    }

    .sublevel-card p {
      font-size: 0.86rem;
      color: #64748b;
      margin-bottom: 1.2rem;
    }

    /* TOMBOL PINK PERSIS SEPERTI GAMBAR */
    .btn-sublevel-action {
      background: var(--theme-pink);
      color: #ffffff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-sublevel-action:hover {
      background: var(--theme-pink-hover);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .locked-notice {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.65rem 0;
    }

    /* ARENA KUIS PROGRESSIVE */
    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .quiz-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .indicator-pill {
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--theme-pink);
    }

    .btn-quit {
      background: none;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-quit:hover {
      color: #ef4444;
    }

    .quiz-meter-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.07);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.6rem;
    }

    .quiz-meter-fill {
      height: 100%;
      background: var(--theme-pink);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      text-align: center;
      margin-bottom: 2rem;
    }

    .prompt-context {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .reading-passage-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-left: 4px solid var(--theme-pink);
      border-radius: 12px;
      padding: 1.2rem;
      margin: 0 auto 1.2rem auto;
      max-width: 680px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #1e293b;
    }

    .prompt-target {
      font-size: 4rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 0.8rem;
      word-break: break-word;
    }

    .prompt-target.audio-hidden {
      font-size: 2.2rem;
      color: var(--theme-pink);
    }

    .prompt-clue {
      font-size: 1.05rem;
      color: #334155;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .btn-listen {
      background: var(--theme-soft-pink);
      color: var(--theme-pink);
      border: 1px solid transparent;
      padding: 0.6rem 1.6rem;
      border-radius: 24px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-listen:hover {
      transform: scale(1.04);
    }

    .options-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .choice-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.15rem 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .choice-card:hover:not(:disabled) {
      border-color: var(--theme-pink);
      background: #fafaf9;
      transform: translateY(-2px);
    }

    .choice-card.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
    }

    .choice-card.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #b91c1c !important;
    }

    .finish-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .score-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem auto;
      border-radius: 50%;
      background: var(--theme-soft-pink);
      color: var(--theme-pink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      border: 3px solid var(--theme-pink);
    }

    @media (max-width: 600px) {
      .options-layout {
        grid-template-columns: 1fr;
      }
      .prompt-target {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body class="theme-jp">

  <header>
    <div class="navbar">
      <div onclick="backToHub()" class="brand-logo">
        <i class="bi bi-mortarboard-fill"></i> LinguaSphere
      </div>
      <ul class="nav-tabs">
        <li><button class="tab-btn active" id="tab-jp" onclick="switchTheme('jp')">🌸 日本語 (Hiragana & Raku Raku)</button></li>
        <li><button class="tab-btn" id="tab-jv" onclick="switchTheme('jv')">🏛️ Jawa & Nusantara</button></li>
        <li><button class="tab-btn" id="tab-en" onclick="switchTheme('en')">🇬🇧 English Studio</button></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- 1. DASHBOARD SUBLEVEL (PERSIS GAMBAR) -->
    <section id="panel-hub" class="view-panel active">
      <div class="glass-box">
        <h2 id="hub-title" style="font-size: 1.6rem; margin-bottom: 0.3rem;">Hiragana & Kurikulum Nihongo Raku Raku</h2>
        <p id="hub-subtitle" style="color: #475569; font-size: 0.95rem;">
          Selesaikan setiap sublevel untuk membuka sublevel berikutnya! Setiap sublevel memuat 10–12 soal acak.
        </p>

        <div class="sublevel-grid" id="moduleCardsContainer">
          <!-- JS Rendered Persis Gambar -->
        </div>
      </div>
    </section>

    <!-- 2. ARENA SOAL KUIS PROGRESSIVE -->
    <section id="panel-quiz" class="view-panel">
      <div class="glass-box">
        <div class="quiz-navbar">
          <span class="indicator-pill" id="soalCategoryTag">SUBLEVEL 1</span>
          <button class="btn-quit" onclick="backToHub()"><i class="bi bi-x-circle"></i> Batalkan</button>
        </div>

        <div class="quiz-meter-bar">
          <div class="quiz-meter-fill" id="soalProgressBar"></div>
        </div>

        <div class="prompt-box">
          <div class="prompt-context" id="soalContextText">Soal 1 dari 10</div>
          
          <div id="readingPassageBox" class="reading-passage-card" style="display: none;"></div>

          <div class="prompt-target" id="soalMainDisplay">...</div>
          <div class="prompt-clue" id="soalClueText">Pertanyaan...</div>
          <button class="btn-listen" id="btnSoundAction" onclick="playAudioCurrent()">
            <i class="bi bi-volume-up-fill"></i> Dengarkan Pelafalan (0.75x)
          </button>
        </div>

        <div class="options-layout" id="soalOptionsGrid">
          <!-- Opsi Jawaban Dinamis -->
        </div>
      </div>
    </section>

    <!-- 3. HASIL AKHIR SUBLEVEL -->
    <section id="panel-finish" class="view-panel">
      <div class="glass-box finish-box">
        <div class="score-badge" id="finishScoreBadge">100%</div>
        <h3 id="finishTitle" style="font-size: 1.6rem; margin-bottom: 0.4rem;">Sublevel Selesai!</h3>
        <p id="finishDesc" style="color: #64748b; margin-bottom: 1rem;">Kamu telah menguasai materi ini.</p>
        <button class="btn-sublevel-action" style="max-width: 250px; margin: 0 auto;" onclick="backToHub()">
          Kembali ke Peta Sublevel
        </button>
      </div>
    </section>
  </main>

  <script>
    // HELPER SHUFFLE
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // BANK SUBLEVEL LENGKAP (JEPANG LENGKAP SAMPAI N, DAKUON, RAKU RAKU + JAWA + INGGRIS)

              { target: 'あい', context: 'Kata Vokal', clue: 'Kata bermakna "cinta", dibaca:', sound: 'あい', options: ['Oi', 'Ai', 'Ie', 'Ue'], correct: 1 },

    // SYSTEM PROGRESSION (Penyimpanan Status Lulus & Gembok di LocalStorage)
    function getPassedModules() {
      try {
        return JSON.parse(localStorage.getItem('linguasphere_passed') || '[]');
      } catch (e) {
        return [];
      }
    }

    function savePassedModule(modId) {
      const passed = getPassedModules();
      if (!passed.includes(modId)) {
        passed.push(modId);
        localStorage.setItem('linguasphere_passed', JSON.stringify(passed));
      }
    }

    // STATE CONTROLLER
    let currentThemeKey = 'jp';
    let activeModule = null;
    let randomizedQuestions = [];
    let currentQIndex = 0;
    let sessionScore = 0;

    function showView(viewId) {
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.classList.remove('active');
      });

      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTheme(key) {
      currentThemeKey = key;
      document.body.className = `theme-${key}`;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${key}`);
      if (activeBtn) activeBtn.classList.add('active');

      renderSublevelHub();
      backToHub();
    }

    // RENDER PERSIS GAMBAR
    function renderSublevelHub() {
      const data = courseDatabases[currentThemeKey];
      if (!data) return;

      document.getElementById('hub-title').innerText = data.title;
      document.getElementById('hub-subtitle').innerText = data.desc;

      const passedList = getPassedModules();
      const container = document.getElementById('moduleCardsContainer');

      container.innerHTML = data.modules.map((mod, idx) => {
        const isPassed = passedList.includes(mod.id);
        // Sublevel pertama selalu terbuka, sublevel berikutnya terbuka jika sublevel sebelumnya sudah lulus
        const isUnlocked = idx === 0 || passedList.includes(data.modules[idx - 1].id);

        if (!isUnlocked) {
          // KARTU TERKUNCI PERSIS GAMBAR
          const prevTitle = data.modules[idx - 1].tag;
          return `
            <div class="sublevel-card locked">
              <div>
                <div class="sublevel-header">
                  <span class="sublevel-tag" style="color: #94a3b8;">${mod.tag}</span>
                  <span class="sublevel-badge-lock"><i class="bi bi-lock-fill"></i> Lock</span>
                </div>
                <h4 style="color: #64748b;">${mod.title}</h4>
                <p>${mod.desc}</p>
              </div>
              <div class="locked-notice">${prevTitle} Harus Lulus</div>
            </div>
          `;
        } else {
          // KARTU TERBUKA / SELESAI PERSIS GAMBAR
          const badgeHtml = isPassed
            ? `<span class="sublevel-badge-done">100% ✓</span>`
            : ``;
          const btnLabel = isPassed ? 'Ulangi &rarr;' : 'Mulai &rarr;';

          return `
            <div class="sublevel-card" onclick="startModuleSession('${mod.id}')">
              <div>
                <div class="sublevel-header">
                  <span class="sublevel-tag">${mod.tag}</span>
                  ${badgeHtml}
                </div>
                <h4>${mod.title}</h4>
                <p>${mod.desc}</p>
              </div>
              <button class="btn-sublevel-action" onclick="startModuleSession('${mod.id}')">
                ${btnLabel}
              </button>
            </div>
          `;
        }
      }).join('');
    }

    function startModuleSession(modId) {
      const pack = courseDatabases[currentThemeKey];
      activeModule = pack.modules.find(m => m.id === modId);
      if (!activeModule) return;

      // ACAK SELURUH SOAL DINAMIS
      randomizedQuestions = shuffleArray(activeModule.questions);
      currentQIndex = 0;
      sessionScore = 0;

      document.getElementById('soalCategoryTag').innerText = activeModule.tag + ' — ' + activeModule.desc;
      renderCurrentCard();
      showView('panel-quiz');
    }

    function renderCurrentCard() {
      const q = randomizedQuestions[currentQIndex];
      const total = randomizedQuestions.length;

      document.getElementById('soalContextText').innerText = `Soal ${currentQIndex + 1} dari ${total}`;
      
      const passageBox = document.getElementById('readingPassageBox');
      if (q.passage) {
        passageBox.style.display = 'block';
        passageBox.innerHTML = `<strong>${q.passageDesc || 'Teks Cerita:'}</strong><br>${q.passage}`;
      } else {
        passageBox.style.display = 'none';
      }

      const mainTargetEl = document.getElementById('soalMainDisplay');
      mainTargetEl.innerText = q.target;
      if (q.isListening) {
        mainTargetEl.classList.add('audio-hidden');
      } else {
        mainTargetEl.classList.remove('audio-hidden');
      }

      document.getElementById('soalClueText').innerText = q.clue;

      const fillPercent = ((currentQIndex + 1) / total) * 100;
      document.getElementById('soalProgressBar').style.width = `${fillPercent}%`;

      // ACAK OPSI JAWABAN
      const optionsWithMeta = q.options.map((opt, originalIdx) => ({
        text: opt,
        isCorrect: originalIdx === q.correct
      }));
      const shuffledOptions = shuffleArray(optionsWithMeta);

      const optionsBox = document.getElementById('soalOptionsGrid');
      optionsBox.innerHTML = shuffledOptions.map(item => `
        <button class="choice-card" onclick="submitChoice(this, ${item.isCorrect})">${item.text}</button>
      `).join('');

      if (q.isListening) {
        setTimeout(playAudioCurrent, 300);
      }
    }

    function submitChoice(buttonEl, isCorrect) {
      const buttons = document.querySelectorAll('.choice-card');
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        buttonEl.classList.add('correct');
        sessionScore += Math.round(100 / randomizedQuestions.length);
      } else {
        buttonEl.classList.add('wrong');
      }

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < randomizedQuestions.length) {
          renderCurrentCard();
        } else {
          showFinishScreen();
        }
      }, 950);
    }

    function showFinishScreen() {
      const finalVal = Math.min(100, sessionScore);
      document.getElementById('finishScoreBadge').innerText = `${finalVal}%`;

      if (finalVal >= 70) {
        savePassedModule(activeModule.id);
        document.getElementById('finishTitle').innerText = '🎉 Sublevel Lulus!';
        document.getElementById('finishDesc').innerText = 'Luar biasa! Sublevel berikutnya kini telah terbuka dan dapat kamu akses.';
      } else {
        document.getElementById('finishTitle').innerText = 'Sedikit Lagi!';
        document.getElementById('finishDesc').innerText = 'Dapatkan minimal nilai 70% untuk membuka sublevel berikutnya.';
      }

      showView('panel-finish');
    }

    function backToHub() {
      renderSublevelHub();
      showView('panel-hub');
    }

    function playAudioCurrent() {
      if (!activeModule || randomizedQuestions.length === 0) return;
      const q = randomizedQuestions[currentQIndex];
      const speechWord = q.sound || q.target;

      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(speechWord);
      utterance.rate = 0.75;
      utterance.pitch = 1.0;

      if (currentThemeKey === 'jp') utterance.lang = 'ja-JP';
      else if (currentThemeKey === 'en') utterance.lang = 'en-US';
      else utterance.lang = 'id-ID';

      window.speechSynthesis.speak(utterance);
    }

    // Jalankan langsung
    renderSublevelHub();
    showView('panel-hub');
  </script>
