<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSphere - Belajar Bahasa & Aksara</title>

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --font-main: 'Outfit', sans-serif;
      --glass-surface: rgba(255, 255, 255, 0.94);
      --glass-border: rgba(255, 255, 255, 0.7);
      --theme-color: #ec4899;
      --theme-hover: #db2777;
      --theme-soft: #fdf2f8;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-card: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      color: var(--text-dark);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      transition: background 0.4s ease-in-out;
    }

    body.theme-jp {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(236, 72, 153, 0.35)),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1600&auto=format&fit=crop');
      --theme-color: #ec4899;
      --theme-hover: #db2777;
      --theme-soft: #fdf2f8;
    }

    body.theme-jv {
      background-image: linear-gradient(135deg, rgba(30, 27, 24, 0.6), rgba(180, 83, 9, 0.38)),
        url('https://images.unsplash.com/photo-1596402184320-417e7178b2cd?q=80&w=1600&auto=format&fit=crop');
      --theme-color: #b45309;
      --theme-hover: #92400e;
      --theme-soft: #fef3c7;
    }

    body.theme-en {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.65), rgba(2, 132, 199, 0.38)),
        url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=1600&auto=format&fit=crop');
      --theme-color: #0284c7;
      --theme-hover: #0369a1;
      --theme-soft: #e0f2fe;
    }

    header {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .brand-logo i {
      color: var(--theme-color);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 0.5rem 1.1rem;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--theme-color);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      border-color: var(--theme-color);
    }

    main {
      max-width: 950px;
      margin: 2.2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .glass-box {
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2.2rem;
      box-shadow: 0 16px 36px 0 rgba(15, 23, 42, 0.14);
      margin-bottom: 2rem;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      margin-top: 1.6rem;
    }

    .unit-card {
      background: #ffffff;
      border: 1.5px solid var(--border-card);
      border-radius: 18px;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 160px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .unit-card:hover {
      transform: translateY(-4px);
      border-color: var(--theme-color);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    .unit-card h4 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }

    .unit-card span.unit-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      display: block;
    }

    .btn-unit-open {
      background: var(--theme-soft);
      color: var(--theme-color);
      border: 1px solid transparent;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s;
    }

    .unit-card:hover .btn-unit-open {
      background: var(--theme-color);
      color: #ffffff;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .quiz-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .indicator-pill {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--theme-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-quit {
      background: none;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-quit:hover {
      color: #ef4444;
    }

    .quiz-meter-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.07);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .quiz-meter-fill {
      height: 100%;
      background: var(--theme-color);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .reading-passage-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-left: 4px solid var(--theme-color);
      border-radius: 12px;
      padding: 1.2rem;
      margin: 0 auto 1.5rem auto;
      max-width: 680px;
      text-align: left;
      font-size: 0.98rem;
      line-height: 1.65;
      color: #1e293b;
    }

    .prompt-target {
      font-size: 4rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 1rem;
      word-break: break-word;
    }

    .prompt-target.audio-hidden {
      font-size: 2.2rem;
      color: var(--theme-color);
    }

    .btn-listen {
      background: var(--theme-soft);
      color: var(--theme-color);
      border: 1px solid transparent;
      padding: 0.6rem 1.6rem;
      border-radius: 24px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-listen:hover {
      transform: scale(1.04);
    }

    .options-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .choice-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.2rem 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .choice-card:hover:not(:disabled) {
      border-color: var(--theme-color);
      background: #fafaf9;
      transform: translateY(-2px);
    }

    .choice-card.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
    }

    .choice-card.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #b91c1c !important;
    }

    .finish-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .score-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem auto;
      border-radius: 50%;
      background: var(--theme-soft);
      color: var(--theme-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      border: 3px solid var(--theme-color);
    }

    .btn-return-hub {
      background: var(--theme-color);
      color: #ffffff;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
      margin-top: 1.2rem;
      transition: all 0.2s;
    }

    .btn-return-hub:hover {
      background: var(--theme-hover);
    }

    @media (max-width: 600px) {
      .options-layout {
        grid-template-columns: 1fr;
      }
      .prompt-target {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body class="theme-jp">

  <header>
    <div class="navbar">
      <div onclick="backToHub()" class="brand-logo">
        <i class="bi bi-mortarboard-fill"></i> LinguaSphere
      </div>
      <ul class="nav-tabs">
        <li><button class="tab-btn active" id="tab-jp" onclick="switchTheme('jp')">🌸 日本語</button></li>
        <li><button class="tab-btn" id="tab-jv" onclick="switchTheme('jv')">🏛️ Jawa</button></li>
        <li><button class="tab-btn" id="tab-en" onclick="switchTheme('en')">🇬🇧 English</button></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- 1. PANEL UTAMA -->
    <section id="panel-hub" class="view-panel active">
      <div class="glass-box">
        <h2 id="hub-title" style="font-size: 1.6rem; margin-bottom: 0.3rem;">Materi Belajar</h2>
        <p id="hub-subtitle" style="color: #475569; font-size: 0.95rem;">
          Pilih topik materi yang ingin kamu latih. Soal dan opsi jawaban akan diacak otomatis.
        </p>

        <div class="unit-grid" id="moduleCardsContainer">
          <!-- Rendered via JS -->
        </div>
      </div>
    </section>

    <!-- 2. ARENA SOAL (BERSIH TANPA DESKRIPSI) -->
    <section id="panel-quiz" class="view-panel">
      <div class="glass-box">
        <div class="quiz-navbar">
          <span class="indicator-pill" id="soalCategoryTag">MATERI</span>
          <button class="btn-quit" onclick="backToHub()"><i class="bi bi-x-circle"></i> Keluar</button>
        </div>

        <div class="quiz-meter-bar">
          <div class="quiz-meter-fill" id="soalProgressBar"></div>
        </div>

        <div class="prompt-box">
          <div id="readingPassageBox" class="reading-passage-card" style="display: none;"></div>

          <div class="prompt-target" id="soalMainDisplay">...</div>
          
          <button class="btn-listen" id="btnSoundAction" onclick="playAudioCurrent()">
            <i class="bi bi-volume-up-fill"></i> Dengar Audio (0.75x)
          </button>
        </div>

        <div class="options-layout" id="soalOptionsGrid">
          <!-- 4 Pilihan Jawaban Acak -->
        </div>
      </div>
    </section>

    <!-- 3. HASIL LATIHAN -->
    <section id="panel-finish" class="view-panel">
      <div class="glass-box finish-box">
        <div class="score-badge" id="finishScoreBadge">100%</div>
        <h3 id="finishTitle" style="font-size: 1.6rem; margin-bottom: 0.4rem;">Selesai!</h3>
        <p id="finishDesc" style="color: #64748b; margin-bottom: 1rem;">Latihan materi ini telah rampung.</p>
        <button class="btn-return-hub" onclick="backToHub()">
          Kembali ke Daftar Materi
        </button>
      </div>
    </section>
  </main>

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let currentThemeKey = 'jp';

    function showView(viewId) {
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.classList.remove('active');
      });

      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTheme(key) {
      currentThemeKey = key;
      document.body.className = `theme-${key}`;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${key}`);
      if (activeBtn) activeBtn.classList.add('active');

      renderModuleHub();
      backToHub();
    }

    function renderModuleHub() {
      const data = courseDatabases[currentThemeKey];
      if (!data) return;

      document.getElementById('hub-title').innerText = data.title;
      document.getElementById('hub-subtitle').innerText = data.desc;

      const container = document.getElementById('moduleCardsContainer');
      container.innerHTML = data.modules.map(mod => `
        <div class="unit-card" onclick="startModuleSession('${mod.id}')">
          <div>
            <h4>${mod.title}</h4>
            <span class="unit-meta">${mod.meta}</span>
          </div>
          <div class="btn-unit-open">Mulai Latihan &rarr;</div>
        </div>
      `).join('');
    }

    function startModuleSession(modId) {
      const pack = courseDatabases[currentThemeKey];
      activeModule = pack.modules.find(m => m.id === modId);
      if (!activeModule) return;

      randomizedQuestions = shuffleArray(activeModule.questions);
      currentQIndex = 0;
      sessionScore = 0;

      document.getElementById('soalCategoryTag').innerText = activeModule.title;
      renderCurrentCard();
      showView('panel-quiz');
    }

    function renderCurrentCard() {
      const q = randomizedQuestions[currentQIndex];
      const total = randomizedQuestions.length;

      const passageBox = document.getElementById('readingPassageBox');
      if (q.passage) {
        passageBox.style.display = 'block';
        passageBox.innerText = q.passage;
      } else {
        passageBox.style.display = 'none';
      }

      const mainTargetEl = document.getElementById('soalMainDisplay');
      mainTargetEl.innerText = q.target;
      if (q.isListening) {
        mainTargetEl.classList.add('audio-hidden');
      } else {
        mainTargetEl.classList.remove('audio-hidden');
      }

      const fillPercent = ((currentQIndex + 1) / total) * 100;
      document.getElementById('soalProgressBar').style.width = `${fillPercent}%`;

      const optionsWithMeta = q.options.map((opt, originalIdx) => ({
        text: opt,
        isCorrect: originalIdx === q.correct
      }));
      const shuffledOptions = shuffleArray(optionsWithMeta);

      const optionsBox = document.getElementById('soalOptionsGrid');
      optionsBox.innerHTML = shuffledOptions.map(item => `
        <button class="choice-card" onclick="submitChoice(this, ${item.isCorrect})">${item.text}</button>
      `).join('');

      if (q.isListening) {
        setTimeout(playAudioCurrent, 300);
      }
    }

    function submitChoice(buttonEl, isCorrect) {
      const buttons = document.querySelectorAll('.choice-card');
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        buttonEl.classList.add('correct');
        sessionScore += Math.round(100 / randomizedQuestions.length);
      } else {
        buttonEl.classList.add('wrong');
      }

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < randomizedQuestions.length) {
          renderCurrentCard();
        } else {
          showFinishScreen();
        }
      }, 900);
    }

    function showFinishScreen() {
      const finalVal = Math.min(100, sessionScore);
      document.getElementById('finishScoreBadge').innerText = `${finalVal}%`;

      if (finalVal >= 70) {
        document.getElementById('finishTitle').innerText = '🎉 Latihan Berhasil!';
        document.getElementById('finishDesc').innerText = 'Skor kamu sangat baik pada materi ini.';
      } else {
        document.getElementById('finishTitle').innerText = 'Tetap Semangat!';
        document.getElementById('finishDesc').innerText = 'Coba ulangi lagi untuk mempertajam pemahamanmu.';
      }

      showView('panel-finish');
    }

    function backToHub() {
      renderModuleHub();
      showView('panel-hub');
    }

    function playAudioCurrent() {
      if (!activeModule || randomizedQuestions.length === 0) return;
      const q = randomizedQuestions[currentQIndex];
      const speechWord = q.sound || q.target;

      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(speechWord);
      utterance.rate = 0.75;
      utterance.pitch = 1.0;

      if (currentThemeKey === 'jp') utterance.lang = 'ja-JP';
      else if (currentThemeKey === 'en') utterance.lang = 'en-US';
      else utterance.lang = 'id-ID';

      window.speechSynthesis.speak(utterance);
    }

    renderModuleHub();
    showView('panel-hub');
  </script>
</body>
</html>
