<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSphere - Belajar Bahasa & Aksara Dunia</title>

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --font-main: 'Outfit', sans-serif;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 16px 36px 0 rgba(15, 23, 42, 0.14);
      --theme-accent: #e11d48;
      --theme-soft: #ffe4e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      color: #0f172a;
      transition: background 0.5s ease-in-out;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    /* TEMA LATAR BELAKANG */
    body.theme-jp {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.45), rgba(225, 29, 72, 0.35)),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #e11d48;
      --theme-soft: #ffe4e6;
    }

    body.theme-jv {
      background-image: linear-gradient(135deg, rgba(30, 27, 24, 0.55), rgba(180, 83, 9, 0.38)),
        url('https://images.unsplash.com/photo-1596402184320-417e7178b2cd?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #b45309;
      --theme-soft: #fef3c7;
    }

    body.theme-en {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(2, 132, 199, 0.38)),
        url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #0284c7;
      --theme-soft: #e0f2fe;
    }

    /* Header Navigasi */
    header {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 0.5rem 1.1rem;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--theme-accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      border-color: var(--theme-accent);
    }

    main {
      max-width: 920px;
      margin: 2.2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Kotak Kaca Glassmorphism */
    .glass-box {
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 2.2rem;
      box-shadow: var(--glass-shadow);
      margin-bottom: 2rem;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grid Kartu Materi */
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
      margin-top: 1.6rem;
    }

    .level-card {
      background: #ffffff;
      border: 1.5px solid rgba(226, 232, 240, 0.85);
      border-radius: 16px;
      padding: 1.4rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .level-card:hover {
      transform: translateY(-4px);
      border-color: var(--theme-accent);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.09);
    }

    .level-pill {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.25rem 0.65rem;
      border-radius: 12px;
      background: var(--theme-soft);
      color: var(--theme-accent);
      margin-bottom: 0.8rem;
    }

    .level-card h4 {
      font-size: 1.12rem;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }

    .level-card p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }

    .btn-card-start {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.65rem;
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s;
    }

    .level-card:hover .btn-card-start {
      background: var(--theme-accent);
      color: #ffffff;
      border-color: var(--theme-accent);
    }

    /* Layar Soal */
    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .quiz-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .indicator-pill {
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--theme-accent);
    }

    .btn-quit {
      background: none;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-quit:hover {
      color: #ef4444;
    }

    .quiz-meter-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.07);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.8rem;
    }

    .quiz-meter-fill {
      height: 100%;
      background: var(--theme-accent);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      text-align: center;
      margin-bottom: 2rem;
    }

    .prompt-context {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .prompt-target {
      font-size: 3.2rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
      margin-bottom: 0.8rem;
      word-break: break-word;
    }

    .prompt-clue {
      font-size: 0.98rem;
      color: #334155;
      margin-bottom: 1rem;
    }

    .btn-listen {
      background: var(--theme-soft);
      color: var(--theme-accent);
      border: 1px solid transparent;
      padding: 0.55rem 1.4rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-listen:hover {
      transform: scale(1.04);
    }

    .options-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .choice-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.15rem 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .choice-card:hover:not(:disabled) {
      border-color: var(--theme-accent);
      background: #fafaf9;
      transform: translateY(-2px);
    }

    .choice-card.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
    }

    .choice-card.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #b91c1c !important;
    }

    /* Layar Selesai */
    .finish-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .score-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem auto;
      border-radius: 50%;
      background: var(--theme-soft);
      color: var(--theme-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      border: 3px solid var(--theme-accent);
    }

    .btn-return-hub {
      background: var(--theme-accent);
      color: #ffffff;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
      margin-top: 1.2rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      transition: all 0.2s;
    }

    .btn-return-hub:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .options-layout {
        grid-template-columns: 1fr;
      }
      .prompt-target {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body class="theme-jp">

  <header>
    <div class="navbar">
      <a href="javascript:void(0)" onclick="backToHub()" class="brand-logo">
        <i class="bi bi-compass-fill"></i> LinguaSphere
      </a>
      <ul class="nav-tabs">
        <li><button class="tab-btn active" id="tab-jp" onclick="switchTheme('jp')">🌸 日本語 (Jepang)</button></li>
        <li><button class="tab-btn" id="tab-jv" onclick="switchTheme('jv')">🏛️ Jawa & Nusantara</button></li>
        <li><button class="tab-btn" id="tab-en" onclick="switchTheme('en')">🇬🇧 English Studio</button></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- ================= 1. DASHBOARD PILIH MODUL ================= -->
    <section id="panel-hub" class="view-panel active">
      <div class="glass-box">
        <h2 id="hub-title" style="font-size: 1.6rem; margin-bottom: 0.3rem;">Belajar Bahasa Jepang (日本語)</h2>
        <p id="hub-subtitle" style="color: #475569; font-size: 0.95rem;">
          Pilih salah satu dari 5 materi di bawah ini untuk memulai latihan interaktif.
        </p>

        <div class="level-grid" id="moduleCardsContainer">
          <!-- Rendered via JS -->
        </div>
      </div>
    </section>

    <!-- ================= 2. ARENA SOAL INTERAKTIF ================= -->
    <section id="panel-quiz" class="view-panel">
      <div class="glass-box">
        <div class="quiz-navbar">
          <span class="indicator-pill" id="soalCategoryTag">MODUL</span>
          <button class="btn-quit" onclick="backToHub()"><i class="bi bi-x-circle"></i> Keluar</button>
        </div>

        <div class="quiz-meter-bar">
          <div class="quiz-meter-fill" id="soalProgressBar"></div>
        </div>

        <div class="prompt-box">
          <div class="prompt-context" id="soalContextText">Soal 1 dari 10</div>
          <div class="prompt-target" id="soalMainDisplay">...</div>
          <div class="prompt-clue" id="soalClueText">Pertanyaan...</div>
          <button class="btn-listen" id="btnSoundAction" onclick="playAudioCurrent()">
            <i class="bi bi-volume-up-fill"></i> Dengar Audio (0.75x)
          </button>
        </div>

        <div class="options-layout" id="soalOptionsGrid">
          <!-- 4 Opsi Jawaban -->
        </div>
      </div>
    </section>

    <!-- ================= 3. LAYAR HASIL AKHIR ================= -->
    <section id="panel-finish" class="view-panel">
      <div class="glass-box finish-box">
        <div class="score-badge" id="finishScoreBadge">100</div>
        <h3 id="finishTitle" style="font-size: 1.6rem; margin-bottom: 0.4rem;">Luar Biasa!</h3>
        <p id="finishDesc" style="color: #64748b; margin-bottom: 1rem;">Kamu telah menyelesaikan modul ini.</p>
        <button class="btn-return-hub" id="btnBackFinish" onclick="backToHub()">
          Kembali ke Modul
        </button>
      </div>
    </section>
  </main>

    // ================= PENGELOLA TAMPILAN & STATE =================
    let currentThemeKey = 'jp';
    let activeModule = null;
    let currentQIndex = 0;
    let sessionScore = 0;

    // FUNGSI GANTI VIEW UTAMA (Mengatasi bug tombol macet)
    function showView(viewId) {
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.classList.remove('active');
        panel.style.display = 'none';
      });

      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
        target.style.display = 'block';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // GANTI TEMA BAHASA
    function switchTheme(key) {
      currentThemeKey = key;
      document.body.className = `theme-${key}`;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${key}`);
      if (activeBtn) activeBtn.classList.add('active');

      renderModuleHub();
      backToHub();
    }

    // RENDER MENU MODUL
    function renderModuleHub() {
      const data = courseDatabases[currentThemeKey];
      document.getElementById('hub-title').innerText = data.title;
      document.getElementById('hub-subtitle').innerText = data.desc;

      const container = document.getElementById('moduleCardsContainer');
      container.innerHTML = data.modules.map(mod => `
        <div class="level-card" onclick="startModuleSession('${mod.id}')">
          <div>
            <span class="level-pill">${mod.level}</span>
            <h4>${mod.title}</h4>
            <p>${mod.desc}</p>
          </div>
          <div class="btn-card-start">Uji Materi Ini (10 Soal) &rarr;</div>
        </div>
      `).join('');
    }

    // MULAI KUIS
    function startModuleSession(modId) {
      const pack = courseDatabases[currentThemeKey];
      activeModule = pack.modules.find(m => m.id === modId);
      if (!activeModule) return;

      currentQIndex = 0;
      sessionScore = 0;

      document.getElementById('soalCategoryTag').innerText = activeModule.title;
      renderCurrentCard();
      showView('panel-quiz');
    }

    // RENDER KARTU SOAL
    function renderCurrentCard() {
      const q = activeModule.questions[currentQIndex];
      const total = activeModule.questions.length;

      document.getElementById('soalContextText').innerText = `Tantangan ${currentQIndex + 1} dari ${total}`;
      document.getElementById('soalMainDisplay').innerText = q.target;
      document.getElementById('soalClueText').innerText = q.clue;

      const fillPercent = ((currentQIndex + 1) / total) * 100;
      document.getElementById('soalProgressBar').style.width = `${fillPercent}%`;

      const optionsBox = document.getElementById('soalOptionsGrid');
      optionsBox.innerHTML = q.options.map((opt, i) => `
        <button class="choice-card" onclick="submitChoice(${i})">${opt}</button>
      `).join('');
    }

    // CEK JAWABAN
    function submitChoice(pickedIdx) {
      const q = activeModule.questions[currentQIndex];
      const buttons = document.querySelectorAll('.choice-card');

      buttons.forEach(b => b.disabled = true);

      if (pickedIdx === q.correct) {
        buttons[pickedIdx].classList.add('correct');
        sessionScore += Math.round(100 / activeModule.questions.length);
      } else {
        buttons[pickedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
      }

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < activeModule.questions.length) {
          renderCurrentCard();
        } else {
          showFinishScreen();
        }
      }, 950);
    }

    // LAYAR HASIL AKHIR
    function showFinishScreen() {
      const finalVal = Math.min(100, sessionScore);
      document.getElementById('finishScoreBadge').innerText = finalVal;

      if (finalVal >= 80) {
        document.getElementById('finishTitle').innerText = '🎉 Pemahaman Sempurna!';
        document.getElementById('finishDesc').innerText = 'Daya tangkapmu luar biasa dalam menuntaskan 10 soal modul ini.';
      } else {
        document.getElementById('finishTitle').innerText = 'Tetap Semangat Berlatih!';
        document.getElementById('finishDesc').innerText = 'Ulangi sesinya sekali lagi untuk memperkuat ingatan kosakata dan tata bahasamu.';
      }

      showView('panel-finish');
    }

    // KEMBALI KE MODUL (DIPERBAIKI SECARA GLOBAL)
    function backToHub() {
      showView('panel-hub');
    }

    // AUDIO PERAMBAN (RATE 0.75x)
    function playAudioCurrent() {
      if (!activeModule) return;
      const q = activeModule.questions[currentQIndex];
      const speechWord = q.sound || q.target;

      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(speechWord);
      utterance.rate = 0.75;
      utterance.pitch = 1.0;

      if (currentThemeKey === 'jp') utterance.lang = 'ja-JP';
      else if (currentThemeKey === 'en') utterance.lang = 'en-US';
      else utterance.lang = 'id-ID';

      window.speechSynthesis.speak(utterance);
    }

    // Inisialisasi awal saat pertama kali web dibuka
    window.onload = function() {
      renderModuleHub();
      showView('panel-hub');
    };
  </script>
