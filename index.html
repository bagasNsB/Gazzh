<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSphere - Belajar Bahasa & Budaya Dunia</title>

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --font-main: 'Outfit', sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --glass-surface: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 16px 32px 0 rgba(15, 23, 42, 0.12);
      --theme-accent: #e11d48;
      --theme-soft: #ffe4e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      color: #0f172a;
      transition: background 0.6s ease-in-out;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    /* THEME BACKGROUNDS */
    body.theme-jp {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.45), rgba(244, 63, 94, 0.35)),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #e11d48;
      --theme-soft: #ffe4e6;
    }

    body.theme-jv {
      background-image: linear-gradient(135deg, rgba(30, 27, 24, 0.55), rgba(180, 83, 9, 0.35)),
        url('https://images.unsplash.com/photo-1596402184320-417e7178b2cd?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #b45309;
      --theme-soft: #fef3c7;
    }

    body.theme-en {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(2, 132, 199, 0.35)),
        url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=1600&auto=format&fit=crop');
      --theme-accent: #0284c7;
      --theme-soft: #e0f2fe;
    }

    /* Top Navigation */
    header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      list-style: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 0.55rem 1.1rem;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--theme-accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    main {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Container Kartu Kaca */
    .glass-box {
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--glass-shadow);
      margin-bottom: 2rem;
      animation: fadeIn 0.35s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Menu Level Cards */
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }

    .level-card {
      background: #ffffff;
      border: 1.5px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      padding: 1.4rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .level-card:hover {
      transform: translateY(-4px);
      border-color: var(--theme-accent);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    .level-pill {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      background: var(--theme-soft);
      color: var(--theme-accent);
      margin-bottom: 0.8rem;
    }

    .level-card h4 {
      font-size: 1.15rem;
      color: #0f172a;
      margin-bottom: 0.3rem;
    }

    .level-card p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }

    .btn-card-start {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.6rem;
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s;
    }

    .level-card:hover .btn-card-start {
      background: var(--theme-accent);
      color: #ffffff;
      border-color: var(--theme-accent);
    }

    /* AREA KUIS INTERAKTIF */
    #arena-soal {
      display: none;
    }

    .quiz-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .indicator-pill {
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--theme-accent);
    }

    .btn-quit {
      background: none;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      color: #64748b;
      cursor: pointer;
    }

    .btn-quit:hover {
      color: #ef4444;
    }

    .quiz-meter-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.8rem;
    }

    .quiz-meter-fill {
      height: 100%;
      background: var(--theme-accent);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      text-align: center;
      margin-bottom: 2rem;
    }

    .prompt-context {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .prompt-target {
      font-size: 3.5rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 0.8rem;
    }

    .prompt-clue {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 1rem;
    }

    .btn-listen {
      background: var(--theme-soft);
      color: var(--theme-accent);
      border: 1px solid transparent;
      padding: 0.55rem 1.3rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-listen:hover {
      transform: scale(1.04);
    }

    /* Pilihan Opsi Respons */
    .options-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    .choice-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.1rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .choice-card:hover:not(:disabled) {
      border-color: var(--theme-accent);
      background: #fafaf9;
      transform: translateY(-2px);
    }

    .choice-card.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
    }

    .choice-card.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #b91c1c !important;
    }

    /* Layar Selesai */
    #arena-finish {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .score-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem auto;
      border-radius: 50%;
      background: var(--theme-soft);
      color: var(--theme-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      border: 3px solid var(--theme-accent);
    }

    @media (max-width: 600px) {
      .options-layout {
        grid-template-columns: 1fr;
      }
      .prompt-target {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body class="theme-jp">

  <header>
    <div class="navbar">
      <a href="#" class="brand-logo">
        <i class="bi bi-compass-fill"></i> LinguaSphere
      </a>
      <ul class="nav-tabs">
        <li><button class="tab-btn active" id="tab-jp" onclick="switchTheme('jp')">🌸 日本語 (Jepang)</button></li>
        <li><button class="tab-btn" id="tab-jv" onclick="switchTheme('jv')">🏛️ Jawa & Nusantara</button></li>
        <li><button class="tab-btn" id="tab-en" onclick="switchTheme('en')">🇬🇧 English Studio</button></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- ================= DASHBOARD PILIH MATERI ================= -->
    <section id="menu-section">
      <div class="glass-box">
        <h2 id="hub-title" style="font-size: 1.6rem; margin-bottom: 0.3rem;">Belajar Bahasa Jepang (日本語)</h2>
        <p id="hub-subtitle" style="color: #475569; font-size: 0.95rem;">
          Mulai dari huruf fonetik, membedakan karakter kembar, hingga dialog nyata di Tokyo.
        </p>

        <div class="level-grid" id="moduleCardsContainer">
          <!-- Rendered via JS -->
        </div>
      </div>
    </section>

    <!-- ================= ARENA SOAL KUIS DINAMIS ================= -->
    <section id="arena-soal">
      <div class="glass-box">
        <div class="quiz-navbar">
          <span class="indicator-pill" id="soalCategoryTag">LEVEL 1 — FONETIK</span>
          <button class="btn-quit" onclick="backToHub()"><i class="bi bi-x-circle me-1"></i>Keluar</button>
        </div>

        <div class="quiz-meter-bar">
          <div class="quiz-meter-fill" id="soalProgressBar"></div>
        </div>

        <div class="prompt-box">
          <div class="prompt-context" id="soalContextText">Pertanyaan 1 dari 5</div>
          <div class="prompt-target" id="soalMainDisplay">あ</div>
          <div class="prompt-clue" id="soalClueText">Manakah bacaan abjad latin yang tepat?</div>
          <button class="btn-listen" id="btnSoundAction" onclick="playAudioCurrent()">
            <i class="bi bi-volume-up-fill"></i> Dengar Audio
          </button>
        </div>

        <div class="options-layout" id="soalOptionsGrid">
          <!-- 4 Opsi Jawaban Dinamis -->
        </div>
      </div>
    </section>

    <!-- ================= LAYAR HASIL AKHIR ================= -->
    <section id="arena-finish">
      <div class="glass-box">
        <div class="score-badge" id="finishScoreBadge">100</div>
        <h3 id="finishTitle" style="font-size: 1.5rem; margin-bottom: 0.5rem;">Sangat Bagus!</h3>
        <p id="finishDesc" style="color: #64748b; margin-bottom: 1.5rem;">Kamu menuntaskan seluruh tantangan materi ini.</p>
        <button class="choice-card" style="background: var(--theme-accent); color: #fff; border: none; max-width: 220px; margin: 0 auto; display: block;" onclick="backToHub()">
          Kembali ke Modul
        </button>
      </div>
    </section>
  </main>

  <script>
    // ================= 1. DATABASE MATERI BERJENJANG =================
    const courseDatabases = {
      // ===== MODUL JEPANG (Tema Sakura & Tokyo) =====
      jp: {
        title: 'Belajar Bahasa Jepang (日本語)',
        desc: 'Jelajahi keindahan aksara Hiragana, Katakana, dan situasi budaya sehari-hari di Jepang.',
        modules: [
          {
            id: 'jp_tier1',
            level: 'Tingkat 1 • Pemula',
            title: 'Hiragana Baris Dasar (A-I-U-E-O)',
            desc: 'Mengenal pelafalan 5 vokal dasar melalui bentuk dan suara lambat.',
            questions: [
              { target: 'あ', context: 'Vokal Dasar', clue: 'Tebak pelafalan karakter hiragana ini:', sound: 'あ', options: ['A', 'O', 'Ka', 'Ta'], correct: 0 },
              { target: 'い', context: 'Vokal Dasar', clue: 'Huruf dua coretan melengkung ini dibaca:', sound: 'い', options: ['U', 'I', 'Shi', 'Ri'], correct: 1 },
              { target: 'う', context: 'Vokal Dasar', clue: 'Manakah bunyi vokal yang tepat?', sound: 'う', options: ['O', 'E', 'U', 'N'], correct: 2 },
              { target: 'え', context: 'Vokal Dasar', clue: 'Lafalkan karakter berikut:', sound: 'え', options: ['A', 'E', 'Ro', 'So'], correct: 1 },
              { target: 'お', context: 'Vokal Dasar', clue: 'Perhatikan coretan bulat di bagian bawah:', sound: 'お', options: ['O', 'A', 'Ha', 'Ho'], correct: 0 }
            ]
          },
          {
            id: 'jp_tier2',
            level: 'Tingkat 2 • Menengah',
            title: 'Karakter Serupa & Mirip',
            desc: 'Tantangan membedakan pasangan huruf mirip seperti さ vs き dan あ vs お.',
            questions: [
              { target: 'さ vs き', context: 'Bentuk Serupa', clue: 'Huruf "SA" hanya memiliki satu garis mendatar, yaitu...', sound: 'さ', options: ['さ', 'き', 'ち', 'そ'], correct: 0 },
              { target: 'れ vs わ', context: 'Kaki Karakter', clue: 'Manakah yang dibaca "WA" (lingkaran bulat menutup)?', sound: 'わ', options: ['れ', 'わ', 'ね', 'め'], correct: 1 },
              { target: 'シ vs ツ', context: 'Katakana Kembar', clue: 'Coretan dari bawah ke atas "SHI" (Katakana) adalah...', sound: 'シ', options: ['ツ', 'シ', 'ン', 'ソ'], correct: 1 }
            ]
          },
          {
            id: 'jp_tier3',
            level: 'Tingkat 3 • Percakapan Realistis',
            title: 'Situasi Etika & Barang (Aisatsu & Mochimono)',
            desc: 'Membaca kalimat utuh pada situasi nyata di stasiun atau restoran.',
            questions: [
              { target: 'ごちそうさまでした', context: 'Etika Restoran', clue: 'Ungkapan sopan yang diucapkan tepat seusai selesai makan:', sound: 'ごちそうさまでした', options: ['Itadakimasu', 'Gochisousama deshita', 'Konnichiwa', 'Sumimasen'], correct: 1 },
              { target: '鞄 (かばん)', context: 'Benda Bawaan', clue: 'Kata "Kaban" artinya adalah...', sound: 'かばん', options: ['Buku catatan', 'Tas punggung/jinjing', 'Jam saku', 'Payung hujan'], correct: 1 },
              { target: 'はじめまして', context: 'Bertemu Orang Baru', clue: 'Salam perkenalan diri pertama kali yang berarti "Senang berkenalan":', sound: 'はじめまして', options: ['Hajimemashite', 'Sayounara', 'Oyasumi', 'Douitashimashite'], correct: 0 }
            ]
          }
        ]
      },

      // ===== MODUL JAWA (Tema Borobudur & Karaton) =====
      jv: {
        title: 'Aksara & Sastra Jawa Nusantara',
        desc: 'Mempelajari nilai luhur carakan, ragam sandhangan pangowah swara, dan tembang macapat.',
        modules: [
          {
            id: 'jv_tier1',
            level: 'Tingkat 1 • Dasar Carakan',
            title: 'Pancaran Huruf Pokok (Ha-Na-Ca-Ra-Ka)',
            desc: 'Mengenal rupa 5 aksara carakan baris pembuka.',
            questions: [
              { target: 'ꦲ', context: 'Carakan Baris 1', clue: 'Aksara ini melambangkan nafas hidup, dibaca:', sound: 'Ha', options: ['Ha', 'Na', 'Ca', 'Ka'], correct: 0 },
              { target: 'ꦤ', context: 'Carakan Baris 1', clue: 'Aksara "Na" berwujud...', sound: 'Na', options: ['ꦫ', 'ꦤ', 'ꦏ', 'ꦢ'], correct: 1 },
              { target: 'ꦫ', context: 'Carakan Baris 1', clue: 'Karakter lengkung dua berikut berbunyi:', sound: 'Ra', options: ['Ca', 'La', 'Ra', 'Wa'], correct: 2 },
              { target: 'ꦏ', context: 'Carakan Baris 1', clue: 'Aksara "Ka" digambarkan dengan rupa:', sound: 'Ka', options: ['ꦏ', 'ꦠ', 'ꦱ', 'ꦥ'], correct: 0 }
            ]
          },
          {
            id: 'jv_tier2',
            level: 'Tingkat 2 • Sandhangan Swara',
            title: 'Pangowah Swara (Vokal Pengubah)',
            desc: 'Memahami fungsi Wulu (i), Suku (u), Taling (é), dan Pepet (e).',
            questions: [
              { target: 'ꦏꦶ', context: 'Sandhangan Wulu', clue: 'Aksara Ka yang diberi tanda bulatan cilik di atasnya dibaca:', sound: 'Ki', options: ['Ku', 'Ki', 'Ké', 'Ko'], correct: 1 },
              { target: 'ꦱꦸ', context: 'Sandhangan Suku', clue: 'Tanda juntai ke bawah (Suku) mengubah vokal menjadi...', sound: 'Su', options: ['Si', 'Se', 'Su', 'Sa'], correct: 2 },
              { target: 'ꦺꦠꦴ', context: 'Taling Tarung', clue: 'Apit taling dan tarung mengubah bunyi konsonan menjadi vokal:', sound: 'To', options: ['O (To)', 'E (Te)', 'U (Tu)', 'I (Ti)'], correct: 0 }
            ]
          },
          {
            id: 'jv_tier3',
            level: 'Tingkat 3 • Sastra Macapat',
            title: 'Paugeran & Watak Tembang',
            desc: 'Uji pemahaman aturan guru gatra, wilangan, dan makna tembang leluhur.',
            questions: [
              { target: '12u - 6a - 8i - 12a', context: 'Aturan Guru Gatra', clue: 'Paugeran dengan 4 larik/gatra tersebut merupakan ciri tembang:', sound: 'Tembang Pocung', options: ['Gambuh', 'Pocung', 'Sinom', 'Kinanthi'], correct: 1 },
              { target: 'Watak Tembang Gambuh', context: 'Karakter Seni', clue: 'Tembang Gambuh memiliki watak yang cocok untuk menyampaikan...', sound: 'Gambuh', options: ['Peperangan seram', 'Nasihat persahabatan akrab', 'Rasa berduka sedih', 'Pernikahan mewah'], correct: 1 }
            ]
          }
        ]
      },

      // ===== MODUL INGGRIS (Tema London Skyline) =====
      en: {
        title: 'English Language Studio',
        desc: 'Asah kepekaan frasa natural, idiom penutur asli, dan respons percakapan sehari-hari.',
        modules: [
          {
            id: 'en_tier1',
            level: 'Tier 1 • Essentials',
            title: 'Polite Conversational Openers',
            desc: 'Memilih kalimat pembuka yang luwes saat berbicara dengan penutur asing.',
            questions: [
              { target: 'How do you do?', context: 'Formal Greeting', clue: 'Respons paling tepat saat pertama kali berjabat tangan resmi:', sound: 'How do you do?', options: ['I am fine, and you?', 'How do you do?', 'Good night', 'Never mind'], correct: 1 },
              { target: 'Excuse me', context: 'Asking for Attention', clue: 'Ungkapan sebelum menanyakan arah stasiun:', sound: 'Excuse me', options: ['Excuse me', 'Watch out', 'Take care', 'No problem'], correct: 0 }
            ]
          },
          {
            id: 'en_tier2',
            level: 'Tier 2 • Native Idioms',
            title: 'Real-World English Idioms',
            desc: 'Pahami apa arti sebenarnya di balik ungkapan kiasan bahasa Inggris.',
            questions: [
              { target: 'Piece of cake', context: 'Idiomatic Expression', clue: 'Jika seorang rekan berkata suatu ujian itu "a piece of cake", artinya:', sound: 'Piece of cake', options: ['Sangat lezat dimakan', 'Sangat mudah diselesaikan', 'Perlu biaya mahal', 'Harus dirayakan'], correct: 1 },
              { target: 'Break a leg!', context: 'Performance Wish', clue: 'Ungkapan ini disampaikan dengan maksud:', sound: 'Break a leg', options: ['Hati-hati jangan jatuh', 'Semoga penampilanmu sukses!', 'Kamu harus beristirahat', 'Jangan lari kencang'], correct: 1 },
              { target: 'Under the weather', context: 'Health Condition', clue: 'Arti dari frasa kiasan "I feel under the weather":', sound: 'Under the weather', options: ['Menikmati udara dingin', 'Kurang enak badan / meriang', 'Lupa membawa payung', 'Kehujanan'], correct: 1 }
            ]
          }
        ]
      }
    };

    // ================= 2. STATE & ENGINE NAVIGASI =================
    let currentThemeKey = 'jp';
    let activeModule = null;
    let currentQIndex = 0;
    let sessionScore = 0;

    function switchTheme(key) {
      currentThemeKey = key;
      document.body.className = `theme-${key}`;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${key}`).classList.add('active');

      renderModuleHub();
      backToHub();
    }

    function renderModuleHub() {
      const data = courseDatabases[currentThemeKey];
      document.getElementById('hub-title').innerText = data.title;
      document.getElementById('hub-subtitle').innerText = data.desc;

      const container = document.getElementById('moduleCardsContainer');
      container.innerHTML = data.modules.map(mod => `
        <div class="level-card" onclick="startModuleSession('${mod.id}')">
          <div>
            <span class="level-pill">${mod.level}</span>
            <h4>${mod.title}</h4>
            <p>${mod.desc}</p>
          </div>
          <div class="btn-card-start">Uji Materi Ini &rarr;</div>
        </div>
      `).join('');
    }

    function startModuleSession(modId) {
      const pack = courseDatabases[currentThemeKey];
      activeModule = pack.modules.find(m => m.id === modId);
      if (!activeModule) return;

      currentQIndex = 0;
      sessionScore = 0;

      document.getElementById('menu-section').style.display = 'none';
      document.getElementById('arena-finish').style.display = 'none';
      document.getElementById('arena-soal').style.display = 'block';

      document.getElementById('soalCategoryTag').innerText = activeModule.title;
      renderCurrentCard();
    }

    function renderCurrentCard() {
      const q = activeModule.questions[currentQIndex];
      const total = activeModule.questions.length;

      document.getElementById('soalContextText').innerText = `Tantangan ${currentQIndex + 1} dari ${total}`;
      document.getElementById('soalMainDisplay').innerText = q.target;
      document.getElementById('soalClueText').innerText = q.clue;

      const fillPercent = ((currentQIndex + 1) / total) * 100;
      document.getElementById('soalProgressBar').style.width = `${fillPercent}%`;

      const optionsBox = document.getElementById('soalOptionsGrid');
      optionsBox.innerHTML = q.options.map((opt, i) => `
        <button class="choice-card" onclick="submitChoice(${i})">${opt}</button>
      `).join('');
    }

    function submitChoice(pickedIdx) {
      const q = activeModule.questions[currentQIndex];
      const buttons = document.querySelectorAll('.choice-card');

      buttons.forEach(b => b.disabled = true);

      if (pickedIdx === q.correct) {
        buttons[pickedIdx].classList.add('correct');
        sessionScore += Math.round(100 / activeModule.questions.length);
      } else {
        buttons[pickedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
      }

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < activeModule.questions.length) {
          renderCurrentCard();
        } else {
          showFinishScreen();
        }
      }, 1000);
    }

    function showFinishScreen() {
      document.getElementById('arena-soal').style.display = 'none';
      const finishBox = document.getElementById('arena-finish');
      finishBox.style.display = 'block';

      const finalVal = Math.min(100, sessionScore);
      document.getElementById('finishScoreBadge').innerText = finalVal;

      if (finalVal >= 80) {
        document.getElementById('finishTitle').innerText = '🎉 Pemahaman Sempurna!';
        document.getElementById('finishDesc').innerText = 'Daya tangkapmu luar biasa dalam materi ini.';
      } else {
        document.getElementById('finishTitle').innerText = 'Tetap Semangat Berlatih!';
        document.getElementById('finishDesc').innerText = 'Ulangi sesinya sekali lagi untuk mempertajam insting bahasamu.';
      }
    }

    function backToHub() {
      document.getElementById('arena-soal').style.display = 'none';
      document.getElementById('arena-finish').style.display = 'none';
      document.getElementById('menu-section').style.display = 'block';
    }

    // ================= 3. MESIN SUARA ARTIKULASI RENDAH (RATE 0.75) =================
    function playAudioCurrent() {
      if (!activeModule) return;
      const q = activeModule.questions[currentQIndex];
      const speechWord = q.sound || q.target;

      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(speechWord);
      utterance.rate = 0.75; // Sesuai permintaan: tempo dibuat tenang dan tidak buru-buru
      utterance.pitch = 1.0;

      if (currentThemeKey === 'jp') utterance.lang = 'ja-JP';
      else if (currentThemeKey === 'en') utterance.lang = 'en-US';
      else utterance.lang = 'id-ID';

      window.speechSynthesis.speak(utterance);
    }

    // Jalankan inisialisasi awal
    window.onload = function() {
      renderModuleHub();
    };
  </script>
</body>
</html>
